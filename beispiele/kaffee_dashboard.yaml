# Dashboard für die Kaffeemaschine – genau so legt es
#   python3 installieren.py --getraenke --personen Jens,Nicole
# in Home Assistant an (Seitenleiste „Konrad“). Zum Nachlesen oder von Hand: Einstellungen →
# Dashboards → Dashboard hinzufügen → „Neues Dashboard von Grund auf“ → öffnen → Stift (bearbeiten) →
# Menü (⋮) → „Rohkonfigurations-Editor“ → diesen Inhalt einfügen → Speichern.
# Die Entitäts-IDs (konrad_…, kaffee_…, lieblingsgetrank_…) heißen bei dir anders – das Skript
# liest die echten aus Home Assistant; von Hand müssen sie angepasst werden.
title: Konrad
views:
- title: Konrad
  path: kaffee
  icon: mdi:coffee
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.konrad_betriebszustand
    name: Konrad
    show_name: true
    show_state: true
    show_icon: true
    color: brown
  - type: entity
    entity: switch.konrad_einschalter
    name: Strom
    show_name: true
    show_state: true
    show_icon: true
    color: green
  - type: entity
    entity: sensor.konrad_bohnenbehalter_leer
    name: Bohnenbehälter leer
    show_name: true
    show_state: false
    show_icon: true
    color: red
    visibility:
    - condition: state
      entity: sensor.konrad_bohnenbehalter_leer
      state_not:
      - 'off'
      - unknown
      - unavailable
  - type: entity
    entity: sensor.konrad_entkalken_des_gerats_empfohlen
    name: Entkalken des Geräts empfohlen
    show_name: true
    show_state: false
    show_icon: true
    color: red
    visibility:
    - condition: state
      entity: sensor.konrad_entkalken_des_gerats_empfohlen
      state_not:
      - 'off'
      - unknown
      - unavailable
  - type: entity
    entity: sensor.konrad_tropfschale_voll
    name: Tropfschale voll
    show_name: true
    show_state: false
    show_icon: true
    color: red
    visibility:
    - condition: state
      entity: sensor.konrad_tropfschale_voll
      state_not:
      - 'off'
      - unknown
      - unavailable
  - type: entity
    entity: sensor.konrad_wassertank_leer
    name: Wassertank leer
    show_name: true
    show_state: false
    show_icon: true
    color: red
    visibility:
    - condition: state
      entity: sensor.konrad_wassertank_leer
      state_not:
      - 'off'
      - unknown
      - unavailable
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: picture-elements
      image: data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMjAwIDUwMCcgd2lkdGg9JzEyMDAnIGhlaWdodD0nNTAwJy8+
      elements:
      - type: image
        entity: sensor.konrad_betriebszustand
        image: data:image/svg+xml;base64,
        state_image:
          inactive: data:image/svg+xml;base64,
          ready: data:image/svg+xml;base64,
          delayedstart: data:image/svg+xml;base64,
          aborting: data:image/svg+xml;base64,
          run: data:image/svg+xml;base64,
          pause: data:image/svg+xml;base64,
          finished: data:image/svg+xml;base64,
          actionrequired: data:image/svg+xml;base64,
          error: data:image/svg+xml;base64,
        filter: none
        state_filter:
          unavailable: grayscale(100%) opacity(45%)
          unknown: grayscale(100%) opacity(45%)
        aspect_ratio: 12x5
        style:
          left: 50%
          top: 50%
          width: 100%
      - type: icon
        icon: mdi:power
        entity: switch.konrad_einschalter
        title: Ein / Aus
        tap_action:
          action: toggle
        style:
          left: 12.5%
          top: 44.0%
          color: '#eceff1'
          --mdc-icon-size: clamp(14px, 2vw, 32px)
      - type: image
        image: data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMCAxMCcgd2lkdGg9JzEwJyBoZWlnaHQ9JzEwJy8+
        title: Jetzt zubereiten
        tap_action:
          action: perform-action
          perform_action: script.kaffee_zubereiten
          confirmation: &id003
            text: Steht eine Tasse unter dem Auslauf? Dann geht es los.
        style:
          left: 27.5%
          top: 78.4%
          width: 8%
      - type: conditional
        conditions: &id002
        - entity: sensor.konrad_betriebszustand
          state: run
        elements:
        - type: state-label
          entity: select.konrad_aktives_programm
          style: &id001
            left: 27.5%
            top: 12.8%
            transform: translate(-50%, -50%)
            color: '#ffffff'
            font-size: clamp(7px, 1.1vw, 15px)
            font-weight: '600'
            max-width: 17%
            white-space: nowrap
            overflow: hidden
            text-overflow: ellipsis
      - type: conditional
        conditions:
        - entity: sensor.konrad_betriebszustand
          state_not: run
        - entity: sensor.konrad_betriebszustand
          state_not: inactive
        - entity: sensor.konrad_betriebszustand
          state_not: unknown
        - entity: sensor.konrad_betriebszustand
          state_not: unavailable
        - entity: select.konrad_ausgewahltes_programm
          state_not: unknown
        - entity: select.konrad_ausgewahltes_programm
          state_not: unavailable
        elements:
        - type: state-label
          entity: select.konrad_ausgewahltes_programm
          style: *id001
      - type: conditional
        conditions: *id002
        elements:
        - type: state-label
          entity: sensor.konrad_programm_fortschritt
          prefix: 'Fortschritt '
          style:
            left: 53.3%
            top: 74.4%
            transform: translate(0, -50%)
            color: '#90a4ae'
            font-size: clamp(11px, 1.8vw, 28px)
      - type: conditional
        conditions:
        - entity: sensor.konrad_wassertank_leer
          state_not: 'off'
        - entity: sensor.konrad_wassertank_leer
          state_not: unknown
        - entity: sensor.konrad_wassertank_leer
          state_not: unavailable
        elements:
        - type: icon
          icon: mdi:water-alert
          entity: sensor.konrad_wassertank_leer
          title: Wassertank leer
          tap_action:
            action: more-info
          style:
            left: 5.5%
            top: 49.0%
            color: '#ffffff'
            background: '#d32f2f'
            border-radius: 50%
            padding: 3px
            --mdc-icon-size: clamp(14px, 2vw, 32px)
      - type: conditional
        conditions:
        - entity: sensor.konrad_bohnenbehalter_leer
          state_not: 'off'
        - entity: sensor.konrad_bohnenbehalter_leer
          state_not: unknown
        - entity: sensor.konrad_bohnenbehalter_leer
          state_not: unavailable
        elements:
        - type: icon
          icon: mdi:seed-off
          entity: sensor.konrad_bohnenbehalter_leer
          title: Bohnenbehälter leer
          tap_action:
            action: more-info
          style:
            left: 27.5%
            top: 4.8%
            color: '#ffffff'
            background: '#d32f2f'
            border-radius: 50%
            padding: 3px
            --mdc-icon-size: clamp(14px, 2vw, 32px)
      - type: conditional
        conditions:
        - entity: sensor.konrad_tropfschale_voll
          state_not: 'off'
        - entity: sensor.konrad_tropfschale_voll
          state_not: unknown
        - entity: sensor.konrad_tropfschale_voll
          state_not: unavailable
        elements:
        - type: icon
          icon: mdi:tray-alert
          entity: sensor.konrad_tropfschale_voll
          title: Tropfschale voll
          tap_action:
            action: more-info
          style:
            left: 27.5%
            top: 91.6%
            color: '#ffffff'
            background: '#d32f2f'
            border-radius: 50%
            padding: 3px
            --mdc-icon-size: clamp(14px, 2vw, 32px)
      - type: conditional
        conditions:
        - entity: sensor.konrad_entkalken_des_gerats_empfohlen
          state_not: 'off'
        - entity: sensor.konrad_entkalken_des_gerats_empfohlen
          state_not: unknown
        - entity: sensor.konrad_entkalken_des_gerats_empfohlen
          state_not: unavailable
        elements:
        - type: icon
          icon: mdi:water-off
          entity: sensor.konrad_entkalken_des_gerats_empfohlen
          title: Entkalken des Geräts empfohlen
          tap_action:
            action: more-info
          style:
            left: 40.3%
            top: 10.0%
            color: '#ffffff'
            background: '#d32f2f'
            border-radius: 50%
            padding: 3px
            --mdc-icon-size: clamp(14px, 2vw, 32px)
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Lieblingsgetränke
      heading_style: title
      icon: mdi:star
    - type: heading
      heading: Jens
      heading_style: subtitle
      icon: mdi:account-circle
    - type: tile
      entity: input_text.lieblingsgetrank_jens_1
      name: Jens 1
      icon: mdi:coffee
      color: amber
      vertical: true
      state_content: state
      tap_action:
